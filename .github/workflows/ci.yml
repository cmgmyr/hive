name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      # A second, older Node -- deliberately a different NODE_MODULE_VERSION
      # than the one below, which is what the addon gets built against.
      # test/kickoff-reexec.test.mjs's alternateInterpreter() needs one of
      # these to exercise the re-exec/ABI-mismatch paths at all; without this,
      # it depends on whatever second Node the runner image happens to carry,
      # which is exactly the "skipped 0" guarantee the comment below exists
      # for. Captured into GITHUB_ENV before the next step's PATH prepend
      # would otherwise bury it.
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: echo "HIVE_TEST_ALT_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Required, not a nicety. The layout tests drive a real tmux server, and
      # the probe tests assert hive's classification of tmux's own error text
      # (src/tmux.ts NOTHING_THERE) against a real tmux. Both skip silently
      # without it, and a skipped classification test is how a tmux wording
      # change would reach main: hive would read the new wording as "unknown"
      # and stop sweeping, which is issue #14 all over again. Keep this step,
      # and keep `npm test` reporting `skipped 0`.
      - run: brew install tmux
      - run: tmux -V
      - run: npm ci
      - run: npm run build
      - run: npm test
