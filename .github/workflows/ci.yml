name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run used to continue to completion. On a 10x macOS runner that
# is the most expensive possible way to learn nothing, and a lane that pushes
# several times paid for every intermediate head.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # Every version reports, rather than the first failure hiding the rest.
      # A break real on one version and absent on another is the whole reason
      # this matrix exists, and fail-fast throws that signal away.
      fail-fast: false
      matrix:
        # 22 is the floor, not 20: fs.globSync (test/docs.test.mjs and
        # scripts/covering-rules.mjs) landed in Node 22, so 20 cannot import
        # either file. A 20 leg was tried on this branch and failed exactly
        # there; supporting it would mean replacing globSync in a test whose
        # dead-rule check genuinely wants a filesystem glob, and 22 was
        # chosen as the floor instead.
        #
        # THE 22 LEG IS PINNED AT THE EXACT DECLARED FLOOR, AND THAT IS A
        # REVERSAL. This comment used to argue the opposite: that the ".5.0"
        # in engines.node was reasoned from the API's history, that
        # `node-version: 22` resolving to the latest 22.x left the patch
        # component unexercised, and that pinning a leg to the floor "would
        # test a version nobody runs" so the honest move was to say the gap
        # out loud. Saying it out loud is what let issue #105 lane B ship a
        # floor of 22.5.0 against a better-sqlite3 whose addon needs Node
        # 22.14.0, where every version in the gap segfaults with empty stdout
        # and empty stderr. A floor nobody runs is a claim, not a constraint,
        # and this matrix is where the claim gets run.
        #
        # So: 22.14.0 exactly, which is where Node-API 10 begins. "Nobody runs
        # it" was the wrong test - the point is not to cover a popular
        # version, it is to cover the BOUNDARY, which is the only version
        # where a floor error is visible. The `floor-boundary` job below
        # covers the versions this leg cannot: below the floor on two release
        # lines, and the 23-line start point.
        #
        # Latest-22.x coverage is what this gives up, and that is a real cost:
        # the 24 legs are what carry "new Node still works" now.
        #
        # `alt` is paired explicitly rather than derived, because the only
        # thing that makes an alt VALID is that its NODE_MODULE_VERSION
        # differs from `node`'s (test/helpers.mjs alternateInterpreter). A
        # rule like "always 22" silently stops discriminating on the leg
        # where 22 IS the primary, and the tests that need it would skip
        # while still reporting green.
        #
        # THE OS SPLIT IS A BILLING DECISION, AND IT IS WRITTEN DOWN BECAUSE
        # THE NUMBERS ARE NOT OBVIOUS. A private repo bills macOS at 10x, so
        # a macOS job that really takes 2.6 minutes is charged 26. Two macOS
        # legs were 1,360 of this account's 1,425 billed minutes in the first
        # four days of August, against 55 for the whole Claude review gate.
        # Linux carries both Node versions, which is where the version signal
        # the comment above argues for actually comes from, and macOS keeps
        # one leg on the NEWEST supported Node. What that macOS leg is really
        # for is the platform, not the version: hive is a macOS tool and the
        # native addon builds there.
        include:
          - os: ubuntu-latest
            node: "22.14.0"
            alt: 24
          - os: ubuntu-latest
            node: 24
            alt: 22
          - os: macos-latest
            node: 24
            alt: 22
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v5
      # A second Node -- deliberately a different NODE_MODULE_VERSION than the
      # one below, which is what the addon gets built against. It does not
      # have to be OLDER, only different: alternateInterpreter() takes the
      # first candidate whose process.versions.modules disagrees with the
      # running one. test/kickoff-reexec.test.mjs needs it to exercise the
      # re-exec/ABI-mismatch paths at all; without this, it depends on
      # whatever second Node the runner image happens to carry, which is
      # exactly the "skipped 0" guarantee the comment below exists for.
      # Captured into GITHUB_ENV before the next step's PATH prepend would
      # otherwise bury it.
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.alt }}
      - run: echo "HIVE_TEST_ALT_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Required, not a nicety. The layout tests drive a real tmux server, and
      # the probe tests assert hive's classification of tmux's own error text
      # (src/tmux.ts NOTHING_THERE) against a real tmux. Both skip silently
      # without it, and a skipped classification test is how a tmux wording
      # change would reach main: hive would read the new wording as "unknown"
      # and stop sweeping, which is issue #14 all over again. Keep this step,
      # and keep `npm test` reporting `skipped 0` ON THIS LEG.
      #
      # That guarantee is per-OS, not global: test/auto-attach-scope.test.mjs
      # skips four darwin-only cases on both ubuntu legs by design (ensureAttached
      # is a no-op off darwin), so `skipped 0` holds on macOS and `skipped 4`
      # is the correct number on Linux. Do not chase that number to 0 on
      # Linux by making those cases runnable there - see that file's own
      # comment for why that would be the false green, not a fix.
      - if: runner.os == 'macOS'
        run: brew install tmux
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      # Unconditional on purpose: it proves the install above actually ran on
      # whichever OS this leg is, so a broken branch fails here rather than as
      # a silent wave of skips inside `npm test`.
      - run: tmux -V
      # Todo 286. Ubuntu's `npm test` measured 191s against macOS's 119s
      # while Ubuntu's own individual suites measured faster, and Ubuntu
      # peaked at 2 test files in flight against macOS's 9 - `node --test`
      # takes its file concurrency from availableParallelism(). The 2-CPU
      # reading was a hypothesis carried across three board revisions and
      # never actually checked; this prints the real number so it stops
      # being one. Not a fix, and `--test-concurrency` is deliberately not
      # raised here - this suite spawns real tmux servers and real MCP
      # processes, and more concurrency is exactly what would feed the
      # unexplained back-to-back full-run flake already on record.
      #
      # Unconditional on both OSes (counselors round 2, item 9 - both seats
      # flagged the Linux-only version): the original comparison is a
      # RATIO, Ubuntu against macOS, and a Linux-only print gives one side
      # of it. Costs about a second on the 10x-billed macOS leg.
      - run: node -e "console.log('availableParallelism', require('os').availableParallelism(), 'cpus', require('os').cpus().length)"
      - run: npm ci
      - run: npm run build
      - run: npm test

  # THE BOUNDARY, RUN FROM BOTH SIDES OF BOTH RELEASE LINES. This is the only
  # thing that can catch what issue #105 lane B shipped: a Node that satisfies
  # engines.node, installs cleanly, and cannot load the addon. On 22.13.1 the
  # pre-fix tree exits 139 with empty stdout and empty stderr - no error,
  # nothing to classify, no diagnostic.
  #
  # 23.5.0 is here because the FIRST fix had the same defect one release line
  # over. Node-API 10 is "v22.14.0+, v23.6.0+ and all later versions", so
  # `">=22.14.0"` admitted 23.0.0 through 23.5.0, every one of them Node-API 9.
  # A single-version floor cannot express a per-release-line matrix, and a
  # single-version CI leg cannot catch that it does not.
  #
  # 23.6.0 is the positive control. Without it these legs only prove hive says
  # no, which a guard that refused everything would also satisfy.
  #
  # These are fixed historical releases and are meant to stay fixed. They stop
  # discriminating only if better-sqlite3's NAPI_VERSION moves, which reddens
  # test/dependency-versions.test.mjs on every other leg first.
  #
  # None of them runs the suite. The suite needs a store, and a store is
  # exactly what a sub-floor Node cannot open.
  floor-boundary:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22.13.1
            expect: refuse
            why: last 22.x below Node-API 10
          - node: 23.5.0
            expect: refuse
            why: satisfies a bare >=22.14.0 and provides Node-API 9
          - node: 23.6.0
            expect: ok
            why: where Node-API 10 starts on the 23 line
    name: node ${{ matrix.node }} must ${{ matrix.expect }} (${{ matrix.why }})
    steps:
      - uses: actions/checkout@v5
      # Install and build under a supported Node; only the last step runs
      # under the boundary one. Building under 22.13.1 would risk failing for
      # an unrelated toolchain reason and reading as a pass.
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: echo "HIVE_BOUNDARY_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: hive's answer for this Node matches what its own declaration promises
        env:
          EXPECT: ${{ matrix.expect }}
        run: |
          set +e
          out=$("$HIVE_BOUNDARY_NODE" dist/cli.js doctor 2>&1)
          code=$?
          set -e
          printf '%s\n' "$out"
          echo "exit=$code napi=$("$HIVE_BOUNDARY_NODE" -p process.versions.napi)"
          if [ "$code" = "139" ]; then
            echo "FAIL: exit 139 is the segfault these legs exist to catch"
            exit 1
          fi
          if [ "$EXPECT" = "refuse" ]; then
            [ "$code" = "1" ] || { echo "FAIL: expected exit 1, got $code"; exit 1; }
            printf '%s\n' "$out" | grep -q "Node-API 10" \
              || { echo "FAIL: no Node-API level in the diagnostic"; exit 1; }
            printf '%s\n' "$out" | grep -q "Rebuilding does NOT help" \
              || { echo "FAIL: the advice reverted to something a rebuild cannot fix"; exit 1; }
          else
            # Not the exit code: a runner without `claude` makes doctor fail
            # correctly and exit 1, which test/CLAUDE.md's standing rule exists
            # for. The addon's own line is the claim under test.
            printf '%s\n' "$out" | grep -qE "ok +better-sqlite3: addon loaded" \
              || { echo "FAIL: the addon should load on this Node"; exit 1; }
          fi
