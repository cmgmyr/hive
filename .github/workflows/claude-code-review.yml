name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    # Dependabot is excluded, and the reason is mechanical rather than a
    # preference. GitHub serves a Dependabot-triggered run from the separate
    # Dependabot secret store, so `secrets.CLAUDE_CODE_OAUTH_TOKEN` resolves
    # to an empty string; the run log says "Secret source: Dependabot" and
    # passes `"claude_code_oauth_token": ""`. claude-code-action also refuses
    # a bot actor unless `allowed_bots` names it, and that refusal is what
    # actually reddened #98 and #99: "Workflow initiated by non-human actor".
    # Setting `allowed_bots` alone moves the failure one step later, to an
    # action holding no credential.
    #
    # Both halves are fixable, by copying the token into Dependabot secrets
    # and naming the bot. Neither is worth doing. A lockfile bump has no
    # logic to review, this reviewer cannot run anything (see step 9 of the
    # runbook), and granting it would hand an agent that holds
    # `gh pr comment` write access a PR body assembled from third-party
    # release notes. The test matrix in ci.yml is the real gate for a
    # dependency bump, it does run on these PRs, and it passed on both.
    #
    # Keyed on `github.actor`, not on the PR author, so that a human pushing
    # a commit onto a Dependabot branch DOES get a review: at that point the
    # run carries Actions secrets again and the exclusion should lift.
    if: github.event.pull_request.draft == false && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history, not a round number: a PR branch's distance from base
          # is unbounded, so only 0 guarantees the merge-base actually exists
          # locally for `git diff`/`git log` against it.
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Read docs/reviewer-preamble.md first and follow it as your
            reviewing instructions: this project's invariants, the finding
            bar, its real false-green test shapes, and the ban on style
            notes, praise, and summary. Do not restate the preamble in your
            findings; it is not something the reader needs repeated back.

            Before reviewing a changed file, open the .claude/rules/*.md
            file whose frontmatter `paths:` covers it, if one exists. Those
            files carry this project's deepest invariants and normally load
            only by being opened in an editor; nothing opens them here
            unless you do. This checkout restores CLAUDE.md and .claude/
            from the base branch, not the PR head, so a rule you open is the
            base branch's copy: if this PR edits that same rule file, you
            are reviewing against its old text, not its new one.

            Use `gh pr diff` for the changed lines, and Read/Grep/Glob
            against the checked-out repo to open what a changed line calls,
            check whether a test would fail without the fix, and read the
            rule file above. Post findings as a single top-level
            `gh pr comment`; use
            `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) for anything anchored to a specific line.

            If you find nothing, do not say the PR looks good and stop
            there. Name what you checked: which invariants applied, which
            call sites of any changed guard or predicate you traced, and
            which test claims you verified rather than took on faith. A
            review that names its checks is evidence; a silent approval is
            not.

            Only post GitHub comments, don't submit review text as messages.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
